<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#922f27">
  <title>韓國秋楓 5天4夜 · 跟團行程</title>
  <!-- 部署版本標記：CI 將 __BUILD_VERSION__ 換成 git SHA；本機開發維持字面值（前端據此略過版本檢查） -->
  <script>window.__BUILD__ = "__BUILD_VERSION__";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Poppins:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=__BUILD_VERSION__">
  <link rel="stylesheet" href="css/maple-theme.css?v=__BUILD_VERSION__">
</head>
<body>
  <!-- 入場：翻牌時鐘（數字由 app.js 依當前韓國時間填入；無 JS／reduced-motion 時自動隱藏） -->
  <div id="deco-loader" class="deco-loader" aria-hidden="true">
    <div class="deco-loader-frame">
      <div class="deco-loader-eyebrow">Autumn · Korea</div>
      <div class="deco-loader-title">韓國秋楓 5天4夜</div>
      <div class="flip-clock">
        <div class="flip-card"><span class="flip-digit flip-new" data-h10></span></div>
        <div class="flip-card"><span class="flip-digit flip-new" data-h1></span></div>
        <span class="flip-colon">:</span>
        <div class="flip-card"><span class="flip-digit flip-new" data-m10></span></div>
        <div class="flip-card"><span class="flip-digit flip-new" data-m1></span></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <img class="maple-leaf" src="assets/maple-leaf.svg" alt="" aria-hidden="true" width="36" height="36">
    <h1 id="app-title" class="topbar-title">韓國秋楓跟團行程</h1>
    <p id="app-sub" class="topbar-sub"></p>
    <p id="app-updated" class="topbar-updated" hidden></p>
  </header>

  <nav id="tabs" class="tabbar" role="tablist" aria-label="行程分頁"></nav>

  <main id="content" class="content" role="tabpanel">
    <p class="loading">行程載入中…</p>
  </main>

  <button id="now-btn" class="now-fab" hidden aria-label="回到現在">
    <span class="now-fab-ico">⟲</span><span class="now-fab-txt">回到現在</span>
  </button>

  <footer class="footer">
    <p>行程可隨時調整 · 編輯 <code>data/itinerary.json</code> 即可</p>
    <p><a href="photo-credits.html">圖片來源與授權</a></p>
  </footer>

  <script src="js/google-maps.js?v=__BUILD_VERSION__"></script>
  <script src="js/now.js?v=__BUILD_VERSION__"></script>
  <script src="js/app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
